name: Three-Tier Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-tier-production
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend

jobs:
  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: |
          docker build \
            -t task-manager-frontend:scan \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t task-manager-backend:scan \
            ./backend

      - name: Manual Trivy setup
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          cache: true
          version: v0.76.2

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: task-manager-frontend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: task-manager-backend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push frontend
        run: |
          docker tag task-manager-frontend:scan \
            "$FRONTEND_IMAGE:${GITHUB_SHA}"

          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"

      - name: Tag and push backend
        run: |
          docker tag task-manager-backend:scan \
            "$BACKEND_IMAGE:${GITHUB_SHA}"

          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
